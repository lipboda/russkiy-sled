name: Publish public dictionary to GitHub Pages
on:
  push:
    branches: [feat/homepage-editorial-redesign, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run test:server
      - name: Export public snapshot without touching a user database
        run: node scripts/export-public.mjs --out site
      - name: Check public data and local resources
        run: node scripts/check-public.mjs site
      - run: npx playwright install --with-deps chromium
      - name: Check pages, search, map and subdirectory resources
        run: node scripts/test-pages.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
